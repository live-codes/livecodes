# Deploys to shared hosting. Supports PHP/MySQL server-side services.
# Triggered on push to `main`, or can be triggered manually with specific branch.
# Requires the variable `PHP_ENV` to be configured.

name: Deploy to PHP

on:
  push:
    branches:
      - main
      - deploy-to-php
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to deploy"
        required: false
        default: "main"

env:
  NODE_VERSION: 24.x

jobs:
  deploy-ftp:
    if: ${{ vars.PHP_ENV != '' }}
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: "--max_old_space_size=8192"
    steps:
      - name: Check if FTP credentials are configured
        id: check
        run: |
          if [ -z "${{ secrets.FTP_HOST }}" ]; then
            echo "FTP_HOST and/or MYSQL_HOST is not set — cancelling deployment."
            echo "proceed=false" >> $GITHUB_OUTPUT
          else
            echo "proceed=true" >> $GITHUB_OUTPUT
          fi

      - name: Checkout code
        if: ${{ steps.check.outputs.proceed == 'true' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || 'main' }}

      - name: Use Node.js
        if: ${{ steps.check.outputs.proceed == 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: "**/package-lock.json"

      - name: Install dependencies
        if: ${{ steps.check.outputs.proceed == 'true' }}
        run: npm ci

      - name: Load PHP_ENV configuration
        if: ${{ steps.check.outputs.proceed == 'true' }}
        run: |
          printf '%s\n' "${{ vars.PHP_ENV }}" > /tmp/php_env.tmp
          while IFS='=' read -r key value; do
            if [ -n "$key" ] && [ -n "$value" ]; then
              echo "$key=$value" >> $GITHUB_ENV
            fi
          done < /tmp/php_env.tmp

      - name: Build
        if: ${{ steps.check.outputs.proceed == 'true' }}
        run: npm run build:app

      - name: Add PHP server files
        if: ${{ steps.check.outputs.proceed == 'true' }}
        run: npm run copy-php

      - name: Create server config
        if: ${{ steps.check.outputs.proceed == 'true' }}
        run: |
          cat > build/config.php <<'HEADER'
          <?php
          return [
          HEADER
          printf "  'MYSQL_HOST' => '%s',\n" "${{ secrets.MYSQL_HOST }}" >> build/config.php
          printf "  'MYSQL_PORT' => '%s',\n" "${{ secrets.MYSQL_PORT }}" >> build/config.php
          printf "  'MYSQL_USER' => '%s',\n" "${{ secrets.MYSQL_USER }}" >> build/config.php
          printf "  'MYSQL_PASSWORD' => '%s',\n" "${{ secrets.MYSQL_PASSWORD }}" >> build/config.php
          printf "  'MYSQL_DATABASE' => '%s',\n" "${{ secrets.MYSQL_DATABASE }}" >> build/config.php
          while IFS='=' read -r key value; do
            case "$key" in
              HOST_NAME|LOG_URL|SELF_HOSTED_SHARE|SELF_HOSTED_BROADCAST)
                printf "  '%s' => '%s',\n" "$key" "$value" >> build/config.php
                ;;
            esac
          done < /tmp/php_env.tmp
          printf "  'API_TOKEN' => '%s',\n" "${{ secrets.API_TOKEN }}" >> build/config.php
          printf "  'BROADCAST_TOKENS' => '%s',\n" "${{ secrets.BROADCAST_TOKENS }}" >> build/config.php
          echo '];' >> build/config.php

      - name: Deploy to FTP server
        if: ${{ steps.check.outputs.proceed == 'true' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}
          protocol: ${{ secrets.FTP_PROTOCOL }}
          server-dir: ${{ secrets.FTP_PATH }}
          local-dir: ./build/

  deploy-ssh:
    if: ${{ vars.PHP_ENV != '' }}
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: "--max_old_space_size=8192"
    steps:
      - name: Check if SSH credentials are configured
        id: check
        run: |
          if [ -z "${{ secrets.SSH_HOST }}" ]; then
            echo "SSH_HOST and/or MYSQL_HOST is not set — cancelling deployment."
            echo "proceed=false" >> $GITHUB_OUTPUT
          else
            echo "proceed=true" >> $GITHUB_OUTPUT
          fi

      - name: Checkout code
        if: ${{ steps.check.outputs.proceed == 'true' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || 'main' }}

      - name: Use Node.js
        if: ${{ steps.check.outputs.proceed == 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: "**/package-lock.json"

      - name: Install dependencies
        if: ${{ steps.check.outputs.proceed == 'true' }}
        run: npm ci

      - name: Load PHP_ENV configuration
        if: ${{ steps.check.outputs.proceed == 'true' }}
        run: |
          printf '%s\n' "${{ vars.PHP_ENV }}" > /tmp/php_env.tmp
          while IFS='=' read -r key value; do
            if [ -n "$key" ] && [ -n "$value" ]; then
              echo "$key=$value" >> $GITHUB_ENV
            fi
          done < /tmp/php_env.tmp

      - name: Build
        if: ${{ steps.check.outputs.proceed == 'true' }}
        run: npm run build:app

      - name: Add PHP server files
        if: ${{ steps.check.outputs.proceed == 'true' }}
        run: npm run copy-php

      - name: Create server config
        if: ${{ steps.check.outputs.proceed == 'true' }}
        run: |
          cat > build/config.php <<'HEADER'
          <?php
          return [
          HEADER
          printf "  'MYSQL_HOST' => '%s',\n" "${{ secrets.MYSQL_HOST }}" >> build/config.php
          printf "  'MYSQL_PORT' => '%s',\n" "${{ secrets.MYSQL_PORT }}" >> build/config.php
          printf "  'MYSQL_USER' => '%s',\n" "${{ secrets.MYSQL_USER }}" >> build/config.php
          printf "  'MYSQL_PASSWORD' => '%s',\n" "${{ secrets.MYSQL_PASSWORD }}" >> build/config.php
          printf "  'MYSQL_DATABASE' => '%s',\n" "${{ secrets.MYSQL_DATABASE }}" >> build/config.php
          while IFS='=' read -r key value; do
            case "$key" in
              HOST_NAME|LOG_URL|SELF_HOSTED_SHARE|SELF_HOSTED_BROADCAST)
                printf "  '%s' => '%s',\n" "$key" "$value" >> build/config.php
                ;;
            esac
          done < /tmp/php_env.tmp
          printf "  'API_TOKEN' => '%s',\n" "${{ secrets.API_TOKEN }}" >> build/config.php
          printf "  'BROADCAST_TOKENS' => '%s',\n" "${{ secrets.BROADCAST_TOKENS }}" >> build/config.php
          echo '];' >> build/config.php

      - name: Deploy via SSH
        if: ${{ steps.check.outputs.proceed == 'true' }}
        uses: SamKirkland/web-deploy@v1
        with:
          target-server: ${{ secrets.SSH_HOST }}
          remote-user: ${{ secrets.SSH_USER }}
          private-ssh-key: ${{ secrets.SSH_KEY }}
          ssh-port: ${{ secrets.SSH_PORT }}
          destination-path: ${{ secrets.SSH_PATH }}
          source-path: ./build/
