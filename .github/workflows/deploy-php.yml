# Deploys to shared hosting. Supports PHP/MySQL server-side services.
# Triggered on push to `main`, or can be triggered manually with specific branch.
# Requires the variable `PHP_ENV` to be configured.

name: Deploy to PHP

on:
  push:
    branches:
      - main
      - deploy-to-php
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to deploy"
        required: false
        default: "main"

env:
  NODE_VERSION: 24.x

jobs:
  deploy-ftp:
    if: ${{ vars.PHP_ENV != '' }}
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: "--max_old_space_size=8192"
    steps:
      - name: Check if FTP and MySQL credentials are configured
        id: check
        run: |
          if [ -z "${{ secrets.FTP_HOST }}" ] || [ -z "${{ vars.PHP_HOST_NAME }}" ]; then
            echo "FTP_HOST and/or PHP_HOST_NAME is not set — cancelling deployment."
            echo "proceed=false" >> $GITHUB_OUTPUT
          else
            echo "proceed=true" >> $GITHUB_OUTPUT
          fi

      - name: Checkout code
        if: ${{ steps.check.outputs.proceed == 'true' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || 'main' }}

      - name: Use Node.js
        if: ${{ steps.check.outputs.proceed == 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: "**/package-lock.json"

      - name: Install dependencies
        if: ${{ steps.check.outputs.proceed == 'true' }}
        run: npm ci

      - name: Build
        if: ${{ steps.check.outputs.proceed == 'true' }}
        env:
          SELF_HOSTED: "true"
          SELF_HOSTED_SHARE: "true"
          SELF_HOSTED_BROADCAST: "true"
          BROADCAST_PORT: "443"
          SANDBOX_HOST_NAME: ${{ vars.PHP_SANDBOX_HOST_NAME }}
          SANDBOX_PORT: "443"
          DOCS_BASE_URL: "null"
          FIREBASE_CONFIG: ${{ secrets.FIREBASE_CONFIG }}
        run: npm run build:app

      - name: Add PHP server files
        if: ${{ steps.check.outputs.proceed == 'true' }}
        run: npm run copy-php

      - name: Create server config
        if: ${{ steps.check.outputs.proceed == 'true' }}
        run: |
          cat > build/config.php <<EOF
          <?php
          return [
            'MYSQL_HOST' => '${{ secrets.MYSQL_HOST }}',
            'MYSQL_PORT' => '${{ secrets.MYSQL_PORT }}',
            'MYSQL_USER' => '${{ secrets.MYSQL_USER }}',
            'MYSQL_PASSWORD' => '${{ secrets.MYSQL_PASSWORD }}',
            'MYSQL_DATABASE' => '${{ secrets.MYSQL_DATABASE }}',
            'HOST_NAME' => '${{ vars.PHP_HOST_NAME }}',
            'LOG_URL' => '${{ secrets.LOG_URL }}',
            'API_TOKEN' => '${{ secrets.API_TOKEN }}',
            'BROADCAST_TOKENS' => '${{ secrets.BROADCAST_TOKENS }}',
          ];
          EOF

      - name: Deploy to FTP server
        if: ${{ steps.check.outputs.proceed == 'true' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}
          protocol: ${{ secrets.FTP_PROTOCOL }}
          local-dir: ./build/
          server-dir: ${{ secrets.FTP_PATH }}

  deploy-ssh:
    if: ${{ vars.PHP_ENV != '' }}
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: "--max_old_space_size=8192"
    steps:
      - name: Check if SSH and MySQL credentials are configured
        id: check
        run: |
          if [ -z "${{ secrets.SSH_HOST }}" ] || [ -z "${{ vars.PHP_HOST_NAME }}" ]; then
            echo "SSH_HOST and/or PHP_HOST_NAME is not set — cancelling deployment."
            echo "proceed=false" >> $GITHUB_OUTPUT
          else
            echo "proceed=true" >> $GITHUB_OUTPUT
          fi

      - name: Checkout code
        if: ${{ steps.check.outputs.proceed == 'true' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || 'main' }}

      - name: Use Node.js
        if: ${{ steps.check.outputs.proceed == 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: "**/package-lock.json"

      - name: Install dependencies
        if: ${{ steps.check.outputs.proceed == 'true' }}
        run: npm ci

      - name: Build
        if: ${{ steps.check.outputs.proceed == 'true' }}
        env:
          SELF_HOSTED: "true"
          SELF_HOSTED_SHARE: "true"
          SELF_HOSTED_BROADCAST: "true"
          BROADCAST_PORT: "443"
          SANDBOX_HOST_NAME: ${{ vars.PHP_SANDBOX_HOST_NAME }}
          SANDBOX_PORT: "443"
          DOCS_BASE_URL: "null"
          FIREBASE_CONFIG: ${{ secrets.FIREBASE_CONFIG }}
        run: npm run build:app

      - name: Add PHP server files
        if: ${{ steps.check.outputs.proceed == 'true' }}
        run: npm run copy-php

      - name: Create server config
        if: ${{ steps.check.outputs.proceed == 'true' }}
        run: |
          cat > build/config.php <<EOF
          <?php
          return [
            'MYSQL_HOST' => '${{ secrets.MYSQL_HOST }}',
            'MYSQL_PORT' => '${{ secrets.MYSQL_PORT }}',
            'MYSQL_USER' => '${{ secrets.MYSQL_USER }}',
            'MYSQL_PASSWORD' => '${{ secrets.MYSQL_PASSWORD }}',
            'MYSQL_DATABASE' => '${{ secrets.MYSQL_DATABASE }}',
            'HOST_NAME' => '${{ vars.PHP_HOST_NAME }}',
            'LOG_URL' => '${{ secrets.LOG_URL }}',
            'API_TOKEN' => '${{ secrets.API_TOKEN }}',
            'BROADCAST_TOKENS' => '${{ secrets.BROADCAST_TOKENS }}',
          ];
          EOF

      - name: Deploy via SSH
        if: ${{ steps.check.outputs.proceed == 'true' }}
        uses: SamKirkland/web-deploy@v1
        with:
          target-server: ${{ secrets.SSH_HOST }}
          remote-user: ${{ secrets.SSH_USER }}
          private-ssh-key: ${{ secrets.SSH_KEY }}
          ssh-port: ${{ secrets.SSH_PORT }}
          destination-path: ${{ secrets.SSH_PATH }}
          source-path: ./build/
