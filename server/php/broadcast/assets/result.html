<!doctype html>
<html lang="en">
  <head>
    <title>LiveCodes Broadcast</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      html,
      body {
        position: relative;
        margin: 0;
        padding: 0;
        overflow: hidden;
        width: 100vw;
        height: 100vh;
      }

      #result {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        border: 0;
      }
    </style>
  </head>
  <body>
    <iframe
      id="result"
      title="LiveCodes Broadcast"
      sandbox="allow-same-origin allow-downloads allow-forms allow-modals allow-orientation-lock allow-pointer-lock allow-popups allow-presentation allow-scripts"
    ></iframe>
    <script>
      const iframe = document.getElementById('result');
      const channel = location.pathname.split('/').filter(Boolean).pop();
      const poll = async () => {
        try {
          const res = await fetch('/broadcast/state.php?channel=' + encodeURIComponent(channel));
          if (res.status === 404) {
            iframe.srcdoc =
              '<div style="text-align: center; padding: 2em;">Broadcast disconnected!</div>';
            return;
          }
          if (!res.ok) throw new Error(res.statusText);
          const { result } = await res.json();
          iframe.srcdoc = result;
        } catch (e) {
          // retry on next interval
        }
        setTimeout(poll, 1500);
      };
      poll();
    </script>
  </body>
</html>
