<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LiveCodes Broadcast</title>
    <style>
      body {
        display: flex;
        flex-direction: column;
        font: 0.9em sans-serif;
        justify-content: center;
        overflow: hidden;
      }
      h1 {
        text-align: center;
        font-size: 1.5em;
        color: rgb(72, 72, 72);
      }
      #container {
        border: 1px solid black;
        border-radius: 5px;
        height: 80vh;
        min-height: 250px;
        width: 80%;
        margin: auto;
      }

      #container iframe {
        border: 0;
        border-radius: 5px;
        height: 100%;
        width: 100%;
      }
      #footer {
        margin: 1em;
        text-align: center;
      }
      #footer a {
        color: rgb(72, 72, 72);
        font-size: 0.9em;
        margin: 1em;
        text-decoration: none;
      }
      #footer a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <h1>LiveCodes Broadcast</h1>
    <div id="container" data-height="80vh"></div>
    <div id="footer">
      <a target="_blank" href="https://livecodes.io">LiveCodes</a>
      <a target="_blank" href="https://livecodes.io/docs/features/broadcast">Broadcast docs</a>
    </div>
    <script type="module">
      import { createPlayground } from '{{AppUrl}}/sdk/livecodes.js';
      const options = {
        appUrl: '{{AppUrl}}',
        config: {
          markup: {
            language: 'html',
            content: 'Loading...',
          },
          readonly: true,
        },
      };
      createPlayground('#container', options).then(async (playground) => {
        const loadConfig = async (_result, config) => {
          await playground.setConfig({
            ...config,
            readonly: true,
          });
          if (config.activeEditor) {
            const { lineNumber = 1, column = 1 } = config[config.activeEditor]?.position || {};
            await playground.show(config.activeEditor, {
              line: lineNumber,
              column,
            });
          }
        };
        const channel = location.pathname.split('/').filter(Boolean).pop();
        const poll = async () => {
          try {
            const res = await fetch('/broadcast/state.php?channel=' + encodeURIComponent(channel));
            if (res.status === 404) {
              await playground.destroy();
              document.querySelector('#container').innerHTML =
                '<div style="text-align: center; padding: 2em;">Broadcast Disconnected!</div>';
              return;
            }
            if (!res.ok) throw new Error(res.statusText);
            const { result, data } = await res.json();
            await loadConfig(result, data);
          } catch (e) {
            // retry on next interval
          }
          setTimeout(poll, 1500);
        };
        poll();
        window.playground = playground;
      });
    </script>
  </body>
</html>
